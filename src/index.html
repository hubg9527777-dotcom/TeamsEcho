<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamsEcho</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --border: #dfe5ec;
      --text: #17212b;
      --muted: #687482;
      --primary: #1769e0;
      --primary-hover: #0f58c6;
      --success: #198754;
      --success-hover: #147242;
      --danger: #c93b36;
      --danger-hover: #ad2c28;
      --focus: rgba(23, 105, 224, 0.18);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 780px;
      min-height: 560px;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 18px;
      gap: 14px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(210px, 0.72fr) minmax(450px, 1.7fr);
      flex: 1;
      min-height: 0;
      gap: 14px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 6px 22px rgba(20, 39, 62, 0.06);
    }

    .panel-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    h1, h2, p { margin: 0; }
    h1 { font-size: 15px; font-weight: 700; }
    .field-hint { font-size: 12px; color: var(--muted); }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 650;
      color: #324150;
    }

    textarea, .rich-editor, select, input[type="range"] { font: inherit; }
    textarea, .rich-editor, select {
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    textarea:focus, .rich-editor:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus);
    }

    textarea {
      flex: 1;
      width: 100%;
      min-height: 0;
      resize: none;
      padding: 11px;
      color: var(--text);
      line-height: 1.55;
    }

    .editor-section { display: flex; flex: 1; min-height: 0; flex-direction: column; }
    .rich-editor {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      color: var(--text);
      line-height: 1.55;
    }
    .rich-editor:empty::before { content: attr(placeholder); color: #8995a3; pointer-events: none; }

    .control-area {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .setting-row { display: grid; grid-template-columns: 118px 1fr; align-items: center; gap: 10px; }
    .setting-row label { margin: 0; }
    select { width: 100%; padding: 8px 10px; color: var(--text); cursor: pointer; }

    .speed-row {
      display: grid;
      grid-template-columns: 118px 1fr 82px;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      border-radius: 9px;
      background: #f2f6fc;
    }
    .speed-row label { margin: 0; }
    .speed-slider { width: 100%; accent-color: var(--primary); cursor: pointer; }
    .speed-label { font-size: 12px; font-weight: 700; color: #24528f; text-align: right; white-space: nowrap; }

    .mode-row { display: grid; grid-template-columns: 118px 1fr; align-items: center; gap: 10px; }
    .mode-label { margin: 0; font-size: 13px; font-weight: 650; color: #324150; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; gap: 3px; border: 1px solid var(--border); border-radius: 9px; background: #f3f6fa; }
    .mode-option { min-height: 34px; border: 0; border-radius: 6px; color: #526171; background: transparent; font-size: 12px; font-weight: 700; }
    .mode-option:hover { transform: none; background: #e8eef5; }
    .mode-option.active-safe { color: #16623d; background: #e7f6ed; box-shadow: inset 0 0 0 1px #bfe2cd; }
    .mode-option.active-turbo { color: #8a4d00; background: #fff0d5; box-shadow: inset 0 0 0 1px #f2cf91; }
    .mode-hint { padding: 9px 11px; border: 1px solid #dce5f0; border-radius: 8px; color: #566575; background: #fafcff; font-size: 12px; line-height: 1.5; }
    .mode-hint.turbo { border-color: #f2cf91; color: #7b4b0c; background: #fffaf1; }

    .run-summary {
      display: grid;
      gap: 5px;
      padding: 10px 11px;
      border: 1px solid #e4eaf2;
      border-radius: 9px;
      background: #fafcff;
    }
    .preview-text, .progress-text { font-size: 12px; line-height: 1.45; }
    .preview-text { color: var(--muted); }
    .progress-text { color: #24528f; font-weight: 650; }

    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      min-height: 38px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .btn-start { background: var(--success); }
    .btn-start:hover { background: var(--success-hover); }
    .btn-stop { background: var(--danger); }
    .btn-stop:hover { background: var(--danger-hover); }

    .footer-tip {
      padding: 10px 12px;
      border: 1px solid #e4eaf2;
      border-radius: 9px;
      color: #566575;
      background: #fff;
      font-size: 12px;
      line-height: 1.45;
    }
    .footer-tip strong { color: #314456; }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="workspace" aria-label="TeamsEcho 自动化编辑区">
      <section class="panel" aria-labelledby="namesHeading">
        <div class="panel-heading">
          <h1 id="namesHeading">提及名单</h1>
          <span class="field-hint">一行一个名字；以 # 开头可跳过</span>
        </div>
        <textarea id="namesInput" aria-label="提及名单" placeholder="张三&#10;李四&#10;#王五（跳过）"></textarea>
      </section>

      <section class="panel" aria-labelledby="messageHeading">
        <div class="editor-section">
          <div class="panel-heading">
            <h1 id="messageHeading">消息内容</h1>
            <span class="field-hint">支持保留富文本格式</span>
          </div>
          <div id="richEditor" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" placeholder="在此输入团队通知内容..."></div>
        </div>

        <div class="control-area">
          <div class="setting-row">
            <label for="sequenceMode">执行顺序</label>
            <select id="sequenceMode">
              <option value="mentionFirst">先批量 @ 提及成员，再追加消息正文</option>
              <option value="textFirst">先写入消息正文，再在末尾批量 @ 提及成员</option>
            </select>
          </div>

          <div class="speed-row">
            <label for="speedSlider">自动化速度</label>
            <input type="range" id="speedSlider" class="speed-slider" min="1" max="10" value="5">
            <span id="speedLabel" class="speed-label">5 档（1.00x）</span>
          </div>

          <div class="mode-row" aria-label="提及模式">
            <span class="mode-label">提及模式</span>
            <div class="mode-switch">
              <button id="modeSafe" class="mode-option active-safe" type="button">稳妥模式</button>
              <button id="modeTurbo" class="mode-option" type="button">极速模式</button>
            </div>
          </div>
          <div id="modeHint" class="mode-hint">稳妥模式：@ → 左移 → 粘贴 → 1 → 删除 → 回车。Windows 保留 103ms 搜索/缓冲锁。</div>

          <div class="run-summary" aria-live="polite">
            <div id="previewText" class="preview-text">待提及名单：共 0 人</div>
            <div id="progressText" class="progress-text">状态：等待运行</div>
          </div>

          <div class="button-row">
            <button id="startBtn" class="btn-start" type="button">开始自动化</button>
            <button id="stopBtn" class="btn-stop" type="button">停止（Esc）</button>
          </div>
        </div>
      </section>
    </section>

    <aside class="footer-tip">
      <strong>运行提示：</strong>开始前请在安全核对栏确认 Teams 已打开富文本大框；确认后程序将连续执行，请勿切换当前 Teams 聊天或浏览器窗口。如需中止，请使用“停止”按钮或 Esc。敏感信息会暂时经过系统剪贴板，建议按需关闭系统剪贴板历史记录。
    </aside>
  </main>

  <script src="./index.js"></script>
</body>
</html>
