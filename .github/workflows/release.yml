name: Secure Release Compiler

on:
  push:
    tags:
      - 'v*'

# 默认最小权限；各 job 仅声明运行所需权限。
permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.target }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target: mac
            output_prefix: TeamsEcho-macos
          - os: macos-14
            arch: x64
            target: mac
            output_prefix: TeamsEcho-intel
          - os: windows-latest
            arch: x64
            target: win
            output_prefix: TeamsEcho-windows
    steps:
      - name: 1. 检出源代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. 初始化 Node.js 环境
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: 3. 安装锁定依赖
        run: npm ci

      - name: 4. 从 tag 同步构建版本
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: 5. 纯本地构建
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: 6. 固定 Release 资产名
        id: name
        shell: bash
        env:
          OUTPUT_PREFIX: ${{ matrix.output_prefix }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: printf 'output_name=%s-%s.zip\n' "$OUTPUT_PREFIX" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: 7. 重命名 macOS 安装包
        if: matrix.target == 'mac'
        shell: bash
        env:
          OUTPUT_NAME: ${{ steps.name.outputs.output_name }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          packages=(*.zip)
          if [ "${#packages[@]}" -ne 1 ]; then
            printf 'Expected exactly one macOS ZIP, found %s: %s\n' "${#packages[@]}" "${packages[*]:-none}" >&2
            exit 1
          fi
          mv "${packages[0]}" "$OUTPUT_NAME"

      - name: 8. 重命名 Windows 安装包
        if: matrix.target == 'win'
        shell: bash
        env:
          OUTPUT_NAME: ${{ steps.name.outputs.output_name }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          packages=(*.zip)
          if [ "${#packages[@]}" -ne 1 ]; then
            printf 'Expected exactly one Windows ZIP, found %s: %s\n' "${#packages[@]}" "${packages[*]:-none}" >&2
            exit 1
          fi
          mv "${packages[0]}" "$OUTPUT_NAME"

      - name: 9. 生成 SHA-256 校验文件
        shell: bash
        env:
          OUTPUT_NAME: ${{ steps.name.outputs.output_name }}
        run: |
          cd dist
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$OUTPUT_NAME" > "$OUTPUT_NAME.sha256"
          else
            sha256sum "$OUTPUT_NAME" > "$OUTPUT_NAME.sha256"
          fi

      - name: 10. 暂存构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/${{ steps.name.outputs.output_name }}
            dist/${{ steps.name.outputs.output_name }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attest and publish final Release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: 1. 下载全部构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-artifacts
          pattern: release-*
          merge-multiple: true

      - name: 2. 组装并验证最终 Release 资产
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-dir
          cp all-artifacts/*.zip release-dir/
          cp all-artifacts/*.sha256 release-dir/
          cd release-dir
          test "$(find . -maxdepth 1 -name '*.zip' -type f | wc -l | tr -d ' ')" -eq 3
          test -f "TeamsEcho-macos-${GITHUB_REF_NAME}.zip"
          test -f "TeamsEcho-intel-${GITHUB_REF_NAME}.zip"
          test -f "TeamsEcho-windows-${GITHUB_REF_NAME}.zip"
          echo "### TeamsEcho ${GITHUB_REF_NAME} SHA-256 Checksums" > csm-manifest.txt
          cat -- *.sha256 >> csm-manifest.txt
          rm -- *.sha256
          ls -lah

      # 先将最终字节流作为 Draft Release 资产上传；之后的 subject-path 与
      # 实际 Release assets 完全一致。发布后若启用 Immutable Releases，GitHub
      # 还会生成 Release attestation。
      - name: 3. 创建 Draft 并上传最终资产
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ github.ref_name }}
          name: TeamsEcho ${{ github.ref_name }}
          body_path: release-dir/csm-manifest.txt
          files: |
            release-dir/TeamsEcho-macos-${{ github.ref_name }}.zip
            release-dir/TeamsEcho-intel-${{ github.ref_name }}.zip
            release-dir/TeamsEcho-windows-${{ github.ref_name }}.zip
            release-dir/csm-manifest.txt
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 对已在 Draft Release 中、且不会再被修改的最终文件生成 provenance。
      - name: 4. 生成最终 Release 资产构件证明
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-dir/TeamsEcho-macos-${{ github.ref_name }}.zip
            release-dir/TeamsEcho-intel-${{ github.ref_name }}.zip
            release-dir/TeamsEcho-windows-${{ github.ref_name }}.zip
            release-dir/csm-manifest.txt

      - name: 5. 发布 Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
